#   proxy_send_timeout 300;                               # ALB 유휴 타임아웃(300초)과 같게 — 다르면 긴 요청이 502 로 끊긴다
#   proxy_read_timeout 300;
#   proxy_buffering off;                                  # SSE 청크를 모아 두지 않는다
