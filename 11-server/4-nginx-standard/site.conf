# 출처: 풀스택 베이스 템플릿 운영 표준 (2026) — 사이트 하나의 server 블록 (/etc/nginx/sites-available/example.com)
# 서버에만 있던 파일이라 운영 표준값(타임아웃 300 · 보안 헤더 · 봇 차단 · SPA 캐시)대로 다시 적었다. TLS 는 ALB 가 끝내므로 80 만 듣는다.
server {
    listen 80;
    server_name example.com;

    root  /home/ubuntu/app/frontend/dist;
    index index.html;

    # 보안 헤더 — 모든 응답에. location 안에서 add_header 를 다시 쓰면 상속이 끊기므로 여기서만 쓴다
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;
    # 고객사 사이트에 iframe 으로 들어가는 위젯은 X-Frame-Options 대신 CSP frame-ancestors 로 허용 도메인을 나열한다
    # add_header Content-Security-Policy "frame-ancestors 'self' https://client.example.com" always;

    # 봇 · 스크레이퍼 UA 차단
    if ($http_user_agent ~* (wget|python-requests|python-urllib|scrapy)) {
        return 403;
    }

    # 민감 파일은 존재 여부도 알리지 않는다
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # 인증 API — 더 낮은 한도
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # 일반 API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # WebSocket
    location /ws/ {
        include /etc/nginx/snippets/proxy-backend.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 업로드 파일 — 캐시 7일(map), 접근 로그 생략
    location /media/ {
        alias /home/ubuntu/app/backend/media/;
        access_log off;
    }

    # 빌드 자산 — 캐시 1년(map), 접근 로그 생략
    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # SPA 진입 — 어떤 경로든 index.html 로. Cache-Control 은 map 기본값 no-store
    location / {
        try_files $uri /index.html;
    }
}

# ---- /etc/nginx/snippets/proxy-backend.conf ---------------------------------
# 위 location 들이 공유하는 프록시 설정. 별도 파일이지만 한 조각으로 보이도록 여기에 붙였다.
