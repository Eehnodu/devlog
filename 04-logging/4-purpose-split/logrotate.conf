# 출처: 팬 플랫폼 서비스 · 전시관 AI 안내 서비스 (2026) — 용도별 로그 파일의 보관 규칙 (/etc/logrotate.d/app)
# 서버에만 있던 설정이라 운영 값(일 단위 · 14~30일 · 압축 지연 · 날짜 확장자)대로 다시 적었다.

# 앱이 직접 여는 전용 로그 파일 — 회전 뒤 reload 로 프로세스가 새 파일을 다시 연다
/var/log/fcm/*.log
/var/log/openai/*.log
/var/log/gemini/*.log
/var/log/celery/celery_*.log
/var/log/ws/*.log
{
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress          # 방금 회전한 파일은 하루 두고 압축 — 아직 쓰고 있을 수 있다
    dateext                # app.log-20260601 처럼 날짜가 붙는다
    su ubuntu ubuntu
    create 0644 ubuntu ubuntu
    sharedscripts
    postrotate
        systemctl reload fastapi.service > /dev/null 2>&1 || true
    endscript
}

# systemd 가 StandardOutput=append: 로 붙여 쓰는 표준 출력 파일 — 프로세스가 파일을 다시 열지 못하므로 copytruncate
/var/log/fastapi/*.log
/var/log/celery/celery.log
{
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
}

# 참고 — 저널 쪽은 /etc/systemd/journald.conf 에서 따로 묶는다
#   SystemMaxUse=50M
#   MaxRetentionSec=24h
# Nginx 접근 로그는 배포판 기본 logrotate(14일)를 그대로 쓰고, 정적 자산 경로는 access_log off.
