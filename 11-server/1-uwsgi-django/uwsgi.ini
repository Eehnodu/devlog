; 출처: AI 상담 챗봇 서비스 (초기 Django 계열, 2025) — uWSGI 로 Django 를 띄우던 설정
; 서버에만 있던 파일이라 당시 운영 방식(소켓으로 Nginx 연결 · 로그는 표준 출력)대로 다시 적었다.
[uwsgi]
chdir = /home/ubuntu/app
module = chatbotProject.wsgi:application
home = /home/ubuntu/app/venv

master = true
processes = 2
threads = 2

; Nginx 가 uwsgi_pass 로 붙는 유닉스 소켓
socket = /tmp/uwsgi.sock
chmod-socket = 666
vacuum = true
die-on-term = true

; 별도 로그 파일 없음 — 표준 출력이 systemd 저널로 간다
logto = /dev/stdout
