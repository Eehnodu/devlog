# 출처: 풀스택 베이스 템플릿 운영 표준 (2026) — /etc/nginx/nginx.conf 의 전역 · http 블록 공통값
# 서버에만 있던 파일이라 운영 표준값(real_ip · limit_req 존 · keepalive · gzip)대로 다시 적었다. 변경 후에는 nginx -t 로 문법 검사 뒤 reload.
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;          # 버전 노출 안 함
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 600M;  # 영상 · 음원 업로드

    # ALB 뒤에 있으므로 실제 클라이언트 IP 를 X-Forwarded-For 에서 복원
    # — 이걸 안 하면 rate limit 이 ALB 의 IP 하나로 묶여 전부 429 가 된다
    set_real_ip_from 10.0.0.0/16;   # VPC 대역
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 요청 제한 존 — API 10r/s, 인증 5r/s. 초과는 429
    limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_status 429;

    # WebSocket Upgrade 분기 — 일반 요청은 keepalive 를 위해 Connection 을 비운다
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 경로별 캐시 정책 — server 블록에서 add_header 한 번으로 끝낸다
    #   진입 HTML no-store : 배포 직후 옛 index 가 새 자산을 가리키는 문제 방지
    #   /assets 1년 immutable : 파일명에 해시가 붙는다
    #   /media 7일 : 업로드 파일
    map $uri $cache_control {
        ~^/assets/   "public, max-age=31536000, immutable";
        ~^/media/    "public, max-age=604800";
        default      "no-store";
    }

    # 백엔드 커넥션 재사용 — 요청마다 TCP 를 새로 열지 않는다
    upstream backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/sites-enabled/*;
}
