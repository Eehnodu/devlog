# 출처: AI 상담 챗봇 서비스 (Django + FastAPI 계열, 2025.06) — 한 도메인에서 경로로 Django(8000) 와 FastAPI(8001) 를 가르던 사이트 설정
# 서버에만 있던 파일이라 당시 구성(API 접두사만 FastAPI, 나머지는 Django)대로 다시 적었다.
server {
    listen 80;
    server_name example.com;

    # 대화 응답(SSE 스트리밍)만 FastAPI
    location /chatbot_v3_api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # SSE 청크를 모아 두지 않는다
        proxy_read_timeout 300;
    }

    # 관리자 화면 · 위젯 HTML 은 Django
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /home/ubuntu/app/static/;
    }

    location /media/ {
        alias /home/ubuntu/app/media/;
    }
}
